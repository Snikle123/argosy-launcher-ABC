name: Build Argosy ABC APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/argosy-abc.jks
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build ABC Release APK (SIGNED)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PciOnly --no-daemon -PabcKeystore=app/argosy-abc.jks
      - name: Upload ABC APK
        uses: actions/upload-artifact@v4
        with:
          name: Argosy-ABC-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
