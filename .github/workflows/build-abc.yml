name: Build Argosy ABC APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build ABC Debug APK
        run: ./gradlew assembleDebug -PciOnly --no-daemon
      - name: Upload ABC APK
        uses: actions/upload-artifact@v4
        with:
          name: Argosy-ABC-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
