name: Build Argosy ABC APK

on:
  workflow_dispatch:
  push:
    branches:
      - abc-stable-backup

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/argosy-abc.jks

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Create keystore.properties
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf "storeFile=../app/argosy-abc.jks\n" > keystore.properties
          printf "storePassword=%s\n" "$KS_PASS" >> keystore.properties
          printf "keyAlias=%s\n" "$K_ALIAS" >> keystore.properties
          printf "keyPassword=%s\n" "$K_PASS" >> keystore.properties
          cp keystore.properties app/keystore.properties

      - name: Build ABC Release APK (SIGNED)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          QUAYPASS_SERVER_PUBKEYS: "dummy_key"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx6144m -XX:+UseParallelGC\""
        run: ./gradlew assembleRelease -PciOnly --no-daemon -PabcKeystore=app/argosy-abc.jks

      - name: Upload ABC APK
        uses: actions/upload-artifact@v4
        with:
          name: Argosy-ABC-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
